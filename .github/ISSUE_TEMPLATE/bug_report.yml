name: Bug report
description: Report a reproducible problem in Study Planner
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include planner exports, personal records, credentials, or security vulnerabilities. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Include the deployed version or commit hash if known.
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 141 on Linux
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage mode
      options:
        - This device (signed out)
        - Synced (signed in)
        - Unknown
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted screenshots or logs if useful.
