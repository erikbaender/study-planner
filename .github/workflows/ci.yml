name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes whatever is still running for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each step is run separately rather than chained, so a failure names
      # itself in the job summary instead of hiding behind "&& exited 1".
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: Build
        run: pnpm build
